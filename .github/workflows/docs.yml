# --- FILE template ---

# Template-only: this deploys Sprout's own documentation site to Sprout's
# Cloudflare account. It uses repo secrets so there isn't really a risk of
# contention with the upstream repository. Honestly i'm still considering
# if the docs themselves could be part of the template, maybe a cuttable
# feature.. idk for now i'm just gonna mark this as template.

name: Docs

# Builds the Hugo docs site and deploys it to Cloudflare Workers
# Static Assets (worker "sprout-docs"). Only runs when docs/ changes.
# One-time Cloudflare setup lives in docs/DEPLOYMENT.md.

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'scripts/vendor.sh'
      - 'scripts/build/common.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check whether docs deployment is enabled
        id: check
        env:
          DOCS_ENABLED: ${{ vars.DOCS_ENABLED }}
        run: |
          if [[ "${DOCS_ENABLED:-}" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "DOCS_ENABLED=true; continuing."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Documentation deployment is disabled. Set the DOCS_ENABLED repository variable to true to build and deploy the documentation."
          fi

  deploy:
    needs: ci-gate
    if: ${{ needs.ci-gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: docs/go.mod
          cache-dependency-path: docs/go.sum

      # Version and hash live in scripts/vendor.sh with every other pin.
      - name: Install Hugo
        run: |
          set -euo pipefail
          hugo_bin=$(./scripts/vendor.sh hugo | sed -n 's/^hugo=//p')
          [[ -n "$hugo_bin" && -x "$hugo_bin" ]] || {
            echo "vendor.sh returned no executable Hugo path" >&2
            exit 1
          }
          dirname "$hugo_bin" >> "$GITHUB_PATH"

      - name: Build site
        working-directory: docs
        env:
          HUGO_ENV: production
          HUGO_ENVIRONMENT: production
        run: |
          go mod download
          go mod verify
          hugo --gc --minify --panicOnWarning

      - name: Deploy to Cloudflare
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # shellcheck source=../../scripts/vendor.sh
          source ../scripts/vendor.sh
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy
